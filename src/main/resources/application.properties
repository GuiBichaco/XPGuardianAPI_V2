# Server Configuration
server.port=8080

# H2 Database Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:xpguardiandb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# JWT Configuration
# IMPORTANTE: Em produção, use uma variável de ambiente para esta chave!
# Gere uma chave segura de 256-bit (32 bytes)
application.security.jwtapplication.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=86400000