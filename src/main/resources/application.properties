# Server Configuration
server.port=8080

# H2 Database Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:xpguardiandb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# JWT Configuration
# IMPORTANTE: Em produção, use uma variável de ambiente para esta chave!
# Gere uma chave segura de 256-bit (32 bytes)
application.security.jwt.secret-key=a3c3e8a0b5d7a6f2e1c9d8b7e4f0a2b1c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8
application.security.jwt.expiration=86400000 # 24 horas em milissegundos
application.security.jwt.refresh-token.expiration=604800000 # 7 dias em milissegundos